version: 2

models:
  - name: fct_orders
    description: Hechos de pedidos (capa Gold).
    columns:
      - name: order_id
        description: Clave primaria del hecho.
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn   
                store_failures: true  
                warn_if: ">0"     
                error_if: ">100"  
              
